name: CLI release

# Release packaging ONLY. Deliberately does NOT run on pull_request or on
# pushes to master.
#
# It ran on both until 2026-07-25 and was a net negative: the Windows `build`
# job failed often enough that a red check stopped carrying information, so it
# was routinely ignored -- at which point it is pure noise plus CI minutes. A
# check nobody trusts is worse than no check, because it still costs attention.
#
# What remains is the part that does real work: attaching the CLI package to a
# published GitHub release, plus workflow_dispatch so it can be run by hand
# before cutting one. If per-PR verification comes back, it should come back as
# something fast and reliable enough to be believed.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install MinGW toolchain (Windows)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
      - name: Build CLI package
        shell: msys2 {0}
        run: python tools/build_cli.py release
      - name: Test boot path handling
        shell: msys2 {0}
        run: |
          cmake --build recompiler/build-cli --target cli_boot_path_test --parallel 2
          ctest --test-dir recompiler/build-cli -R '^cli_boot_path_test$' --output-on-failure
      - name: Smoke test packaged CLI
        shell: msys2 {0}
        run: dist/psxrecomp-cli-windows-x86_64/psxrecomp.exe --help
      - uses: actions/upload-artifact@v6
        with:
          name: psxrecomp-cli-windows-x86_64
          path: dist/psxrecomp-cli-*.zip
          if-no-files-found: error

  # Every registered test in both CMake projects, including cli_boot_path_test.
  # Nothing else configures the runtime tree with BUILD_TESTING=ON, and that is
  # how its fixtures stopped linking unnoticed. The runtime tree needs no
  # generated BIOS for its tests, and SDL builds headless.
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Configure recompiler tests
        run: cmake -S recompiler -B recompiler/build -DBUILD_TESTING=ON
      - name: Build recompiler tests
        run: cmake --build recompiler/build --parallel 4
      - name: Run recompiler tests
        run: ctest --test-dir recompiler/build --output-on-failure --parallel 4
      - name: Install GL development files
        # psx-runtime and psx-oracle are part of the runtime tree's default
        # build and link libGL (gpu_gl_renderer.c).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl-dev
      - name: Configure runtime tests
        run: >-
          cmake -S runtime -B runtime/build -DBUILD_TESTING=ON
          -DPSXRECOMP_ALLOW_NO_BIOS=ON -DPSX_RECOMP_UI=OFF -DPSX_REWIND=OFF
          -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_UNIX_CONSOLE_BUILD=ON
      - name: Build runtime tests
        run: cmake --build runtime/build --parallel 4
      - name: Run runtime tests
        run: ctest --test-dir runtime/build --output-on-failure --parallel 4

  publish-release-assets:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: psxrecomp-cli-*
          merge-multiple: true
      - name: Attach CLI packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "$RELEASE_TAG" psxrecomp-cli-*.zip
          --repo "$GITHUB_REPOSITORY" --clobber
