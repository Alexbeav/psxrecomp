name: Native portability checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gcc9-runtime:
    runs-on: ubuntu-24.04
    container: ubuntu:20.04@sha256:c664f8f86ed5a386b0a340d981b8f81714e21a8b9c73f658c4bea56aa179d54a
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: label-only-control
            ref: 3c4fc897002d2622adb89ec47a81b113157c545d
            expect_failure: true
    steps:
      - name: Install native compiler and build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential git ca-certificates curl python3 python3-pip ninja-build pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libxinerama-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libwayland-dev libxkbcommon-dev
          python3 -m pip install cmake==3.31.6 tomli
          gcc --version
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          submodules: recursive
          persist-credentials: false
      - name: Configure native setup host
        run: cmake -S runtime -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPSXRECOMP_ALLOW_NO_BIOS=ON -DPSX_RECOMP_UI=OFF -DPSX_SETUP_WIZARD=OFF -DPSX_DEBUG_TOOLS=OFF -DPSX_NETPLAY=OFF -DPSX_REWIND=OFF -DPSX_ENABLE_VULKAN=OFF
      - name: Compare the full runtime build outcome
        env:
          EXPECT_FAILURE: ${{ matrix.expect_failure }}
        run: |
          status=0
          cmake --build build --target psx-runtime --parallel 4 > native-build.log 2>&1 || status=$?
          cat native-build.log
          if [ "$EXPECT_FAILURE" = "true" ]; then
            test "$status" -ne 0
            grep -E 'a label can only be part of a statement|undefined reference to.*fntrace_is_game_started' native-build.log
          else
            test "$status" -eq 0
            python3 runtime/tests/test_fntrace_c_linkage.py
            python3 runtime/tests/test_overlay_retry_c11.py --compiler gcc
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcc9-${{ matrix.name }}-evidence
          path: |
            native-build.log
            build/CMakeCache.txt
          if-no-files-found: error
