name: BIOS seed corpus checks
on:
  pull_request:
    paths:
      - "recompiler/seeds/**"
      - "tools/bios_seed_corpus.py"
      - "tools/filter_bios_seeds.py"
      - "tests/test_bios_seed_corpus.py"
      - ".github/workflows/bios-seeds.yml"
  push:
    paths:
      - "recompiler/seeds/**"
      - "tools/bios_seed_corpus.py"
      - "tools/filter_bios_seeds.py"
      - "tests/test_bios_seed_corpus.py"
      - ".github/workflows/bios-seeds.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No retail BIOS images in CI: the derivation checks report as skipped.
      - name: Seed corpus consistency
        run: python -m unittest tests.test_bios_seed_corpus -v
