name: TAS replay source checks
on:
  # 2026-09-28: those three branches were dead refs - the default branch is main - so this
  # workflow never ran on a push or PR and only ever ran by hand. Point it at real refs.
  # wave5/** as in kit-emitter-rebuild.yml: wave branches take changes before main (PS1B-147).
  # A pull request into any branch, wave5 ones included, already runs it.
  pull_request:
  push:
    branches: [main, "wave5/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-ucrt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
      - name: Build and test without retail assets
        shell: msys2 {0}
        run: |
          cmake -S recompiler -B build/tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build build/tests --parallel 4
          ctest --test-dir build/tests --output-on-failure -j 4
